model:
  dropout: 0.1
  freeze_encoder: false
  freeze_feature_encoder: true
  keep_layers: null
  layerdrop: 0.0
  mask_time_prob: 0.05
  pretrained_model: facebook/wav2vec2-base
  type: wav2vec2
  use_joint_head: false
training:
  batch_size: 16
  early_stopping_patience: 3
  encoder_learning_rate: 3.0e-05
  epochs: 15
  fp16: true
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  learning_rate: 0.001
  warmup_ratio: 0.1
  weight_decay: 0.01
