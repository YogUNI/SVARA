# SVARA — Base Configuration
# Reference: docs/03 §4, docs/01 §3

paths:
  raw_data_dir: "data/raw/fluent_speech_commands_dataset"
  processed_splits_dir: "data/processed/splits"
  reports_dir: "reports"
  runs_dir: "reports/runs"
  metrics_dir: "reports/metrics"
  models_dir: "models"

audio:
  sample_rate: 16000
  channels: 1
  # max_audio_seconds to be set from duration p99 in EDA (P1-06)
  max_audio_seconds: 5

seed:
  default: 42
  experiment_seeds: [42, 43, 44]
